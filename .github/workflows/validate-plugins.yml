name: validate-plugins

# These plugins fail silently: an artifact whose frontmatter doesn't parse
# never registers — it just vanishes from the skills list in every consuming
# repo, with no error anywhere. PR time is the last moment a human is looking
# before it propagates. See scripts/validate-plugins.py.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate below diffs this branch against its merge base, and
          # the default depth-1 checkout has no base ref to resolve — the gate
          # would error instead of judging. This is the one failure invisible on
          # a laptop, where every ref is already on disk.
          fetch-depth: 0
      - name: Validate plugin artifacts (frontmatter + manifests)
        run: python3 scripts/validate-plugins.py
      # Shared facts now live in EVIDENCE.md and are *linked* rather than
      # restated, which trades one failure mode for another: a referenced file
      # is only as good as the reference being followed. EVIDENCE.md shipped
      # linked from 5 artifacts while needed by 8 — caught by a hand audit, by
      # luck, once. Nothing about that miss was visible in any file: both the
      # link and its absence parse fine. This reads the "Referenced by" line as
      # a manifest and enforces the backlink in both directions.
      - name: Check artifact links + the EVIDENCE.md backlink contract
        run: python3 scripts/check-artifact-links.py
      # These artifacts absorbed 121 recorded occurrences of real failures, and
      # prose has no compiler: an edit that tightens a sentence can delete the
      # fact inside it and leave every other gate green. Each needle is one
      # distinctive phrase per absorbed fact, asserted present *corpus-wide* —
      # so content is free to move between artifacts (that is the whole point of
      # splitting them) while a deletion still fails loudly.
      - name: Check the absorbed facts are still in the corpus (needles)
        run: python3 scripts/check-needles.py
      # GitHub's closing keywords bind to exactly one reference each, so
      # `Closes #56 #62 #63 #78 #139` closes #56 and files the other four as
      # ordinary mentions — they get a cross-reference link and stay open. There
      # is nothing to see: the commit is well-formed, the PR reports MERGED, and
      # every step above is green, because none of them reads a commit message.
      # One PR here shipped seven such lines: 80 references, 7 closures, 73
      # issues left open, found days later by someone counting the backlog. This
      # is the reassuring-failing shape EVIDENCE.md §1 is about — the identical
      # defect in an alarming check costs a minute.
      #
      # It reads the branch's commit messages *and* every .md, because the
      # artifacts are where the syntax is taught: a command showing the bare list
      # is the upstream of the malformed commit, not a copy of it. The gate runs
      # its own positive control over built-in specimens before judging anything,
      # so a regex edited into never matching fails loudly instead of reporting a
      # clean tree in a clean tree's voice.
      - name: Check issue-closing syntax (commit messages + examples)
        run: python3 scripts/check-closes-syntax.py "origin/${{ github.base_ref || 'master' }}"
      # The shipped UserPromptSubmit hook runs on every prompt in every repo
      # where the plugin is enabled, and a non-zero exit blocks the prompt.
      # Run it under dash too — `sh` is dash on Debian/Ubuntu, bash on macOS.
      - name: Test shipped hooks (esas-pending)
        run: |
          sh scripts/test-hooks.sh
          HOOK_SH=dash sh scripts/test-hooks.sh
          HOOK_SH=bash sh scripts/test-hooks.sh
      # /design's board-mode preflight is a shell block inside the command's
      # markdown, so it has no compiler and no import to break loudly. This
      # extracts and runs the shipped block against fixture host repos.
      - name: Test /design board mode (esas-design)
        run: |
          sh scripts/test-esas-design.sh
          PREFLIGHT_SH=dash sh scripts/test-esas-design.sh
          PREFLIGHT_SH=bash sh scripts/test-esas-design.sh
      # Every step above reads the source tree. This one reads the *diff*,
      # because the failure it guards is not in any file: a plugin is copied into
      # the version-keyed cache only when its `version` string changes, so a
      # correct source tree that kept its old version reaches nobody — which is
      # how two behaviour-changing commits once shipped with this workflow green,
      # and green correctly.
      #
      # The gate and its oracle live in scripts/, outside plugins/**, and that is
      # load-bearing rather than tidy: a rule that lived inside a plugin would
      # count as a touch of that plugin, so changing the rule — or repairing
      # it — would demand a release. Outside, it never fires on its own change,
      # and it exempts nothing else.
      #
      # On `push` to master the base is master, the diff is empty, and this is a
      # correct no-op; the judgement happens on the pull request.
      - name: Require a version bump for every touched plugin
        run: sh scripts/check-plugin-version-bump.sh "origin/${{ github.base_ref || 'master' }}"
      # The gate itself has no compiler and only ever runs on somebody else's PR,
      # so a broken one is discovered by the PR it wrongly judged. This drives it
      # over throwaway git repos. Both interpreters are varied together — the
      # suite's and the gate's — because `sh` is dash on Debian/Ubuntu and bash
      # on macOS, and both scripts ship as POSIX.
      - name: Test the version gate (throwaway git repos)
        run: |
          sh scripts/test-version-gate.sh
          GATE_SH=dash dash scripts/test-version-gate.sh
          GATE_SH=bash bash scripts/test-version-gate.sh
