name: validate-plugins

# These plugins fail silently: an artifact whose frontmatter doesn't parse
# never registers — it just vanishes from the skills list in every consuming
# repo, with no error anywhere. PR time is the last moment a human is looking
# before it propagates. See scripts/validate-plugins.py.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate below diffs this branch against its merge base, and
          # the default depth-1 checkout has no base ref to resolve — the gate
          # would error instead of judging. This is the one failure invisible on
          # a laptop, where every ref is already on disk.
          fetch-depth: 0
      - name: Validate plugin artifacts (frontmatter + manifests)
        run: python3 scripts/validate-plugins.py
      # An agent with no `tools:` key runs unrestricted — the failure is
      # silent (nothing errors, the agent just carries more capability than
      # reviewed) until an incident traces it back. This suite is the oracle
      # for that refusal; it must run here or a future agent without the key
      # ships clean.
      - name: Test the tools allowlist rule (validate-plugins)
        run: |
          sh scripts/test-validate-plugins.sh
          VP_PY=python3 sh scripts/test-validate-plugins.sh
      # Shared facts now live in EVIDENCE.md and are *linked* rather than
      # restated, which trades one failure mode for another: a referenced file
      # is only as good as the reference being followed. EVIDENCE.md shipped
      # linked from 5 artifacts while needed by 8 — caught by a hand audit, by
      # luck, once. Nothing about that miss was visible in any file: both the
      # link and its absence parse fine. This reads the "Referenced by" line as
      # a manifest and enforces the backlink in both directions.
      - name: Check artifact links + the EVIDENCE.md backlink contract
        run: python3 scripts/check-artifact-links.py
      # These artifacts absorbed 121 recorded occurrences of real failures, and
      # prose has no compiler: an edit that tightens a sentence can delete the
      # fact inside it and leave every other gate green. Each needle is one
      # distinctive phrase per absorbed fact, asserted present *corpus-wide* —
      # so content is free to move between artifacts (that is the whole point of
      # splitting them) while a deletion still fails loudly.
      - name: Check the absorbed facts are still in the corpus (needles)
        run: python3 scripts/check-needles.py
      # The steps above all assert *presence*, corpus-wide and on purpose, so a
      # rule stays free to move between artifacts. That tolerance is exactly what
      # blinds them to a *split*: once a rule stops being inline and starts living
      # behind a pointer, "the fact is still in the repo" stops answering the
      # question, which is now whether the pointer is followed. That bill has been
      # paid once — EVIDENCE.md shipped linked from 5 artifacts while needed by 8,
      # every step above green, because both the link and its absence parse fine.
      #
      # scripts/eval/ answers it by running real headless sessions and asserting
      # which file each one opened. It is deliberately NOT here: it consumes real
      # usage, needs an authenticated `claude` CLI, and is non-deterministic. This
      # is the CI-safe half — it runs no session, it only refuses a split that
      # shipped with nothing guarding it, so the expensive run stays manual while
      # an unguarded split cannot merge.
      #
      # Like check-closes-syntax.py it runs its own positive control over built-in
      # specimens before judging anything, and treats a missing/empty scenarios
      # file — or a corpus yielding zero splits while plainly having the materials
      # for one — as an error. A coverage gate reporting full coverage of nothing
      # is the exact reassuring-failing shape it exists to stop.
      - name: Check every split has a behavioral scenario (eval coverage)
        run: python3 scripts/check-eval-coverage.py
      # GitHub's closing keywords bind to exactly one reference each, so
      # `Closes #56 #62 #63 #78 #139` closes #56 and files the other four as
      # ordinary mentions — they get a cross-reference link and stay open. There
      # is nothing to see: the commit is well-formed, the PR reports MERGED, and
      # every step above is green, because none of them reads a commit message.
      # One PR here shipped seven such lines: 80 references, 7 closures, 73
      # issues left open, found days later by someone counting the backlog. This
      # is the reassuring-failing shape EVIDENCE.md §1 is about — the identical
      # defect in an alarming check costs a minute.
      #
      # It reads the branch's commit messages *and* every .md, because the
      # artifacts are where the syntax is taught: a command showing the bare list
      # is the upstream of the malformed commit, not a copy of it. The gate runs
      # its own positive control over built-in specimens before judging anything,
      # so a regex edited into never matching fails loudly instead of reporting a
      # clean tree in a clean tree's voice.
      - name: Check issue-closing syntax (commit messages + examples)
        run: python3 scripts/check-closes-syntax.py "origin/${{ github.base_ref || 'master' }}"
      # The owner's rule: every gate a flow runs is SCOPED to that flow's own diff.
      # The whole-repo run (--full / --all) happens once, here in CI or when the
      # owner asks for it by name — never off a flow step's own judgement, which
      # would spend tens of minutes of laptop time per unit re-proving an
      # untouched tree. This guard fails on any gate INVOCATION in a command,
      # agent or skill carrying that flag; prose forbidding it is allowed.
      - name: No flow artifact runs the gate whole-repo
        run: python3 scripts/check-no-full-gate.py
      # A fix-round cause recorded three or more times across docs/prs/ must have a
      # disposition in docs/causes.md: a deterministic check if it is mechanical, an
      # explicit judgement with its reason if it is not. Writing the rule down a
      # second time is not a disposition — that is what this makes visible.
      - name: Repeat fix-round causes are disposed, not tallied
        run: python3 scripts/check-repeat-causes.py
      # The shipped UserPromptSubmit hook runs on every prompt in every repo
      # where the plugin is enabled, and a non-zero exit blocks the prompt.
      # Run it under dash too — `sh` is dash on Debian/Ubuntu, bash on macOS.
      - name: Test shipped hooks (esas-pending)
        run: |
          sh scripts/test-hooks.sh
          HOOK_SH=dash sh scripts/test-hooks.sh
          HOOK_SH=bash sh scripts/test-hooks.sh
      # The base plugin's hook suite above is hardcoded to
      # `plugins/bett3r-ai-workflow` and to two named scripts inside it, so it
      # collects nothing from `bett3r-xp-layer`. Without this step that
      # plugin's two hooks would ship with every check on this workflow green,
      # and green *correctly* — a gate list is a list of runners, not a map of
      # what they observe. These hooks run before and after EVERY Bash call in
      # EVERY repo where the plugin is enabled, and a non-zero PreToolUse exit
      # cancels the user's command, so the same three interpreters apply.
      - name: Test shipped hooks (experience-layer capture overlay)
        run: |
          sh scripts/test-xp-layer-hooks.sh
          HOOK_SH=dash sh scripts/test-xp-layer-hooks.sh
          HOOK_SH=bash sh scripts/test-xp-layer-hooks.sh
      # Seam A (the .work/ mode marker) and Seam B (the /design Step 1 context
      # extension point) are prose contracts in the base plugin's commands, so
      # nothing compiles them and no existing runner collects them. The marker's
      # load-bearing half is the CLEARING, whose failure signature is absence —
      # a stale work item read as the current one, with nothing going red.
      # One invocation, deliberately: unlike the hook suites above, this oracle
      # extracts a YAML block rather than a shell block, so there is no
      # interpreter to vary and a dash/bash matrix here would run the identical
      # assertions three times while reading as interpreter coverage.
      - name: Test the flow seams (mode marker + context providers)
        run: sh scripts/test-flow-seams.sh
      # /design's board-mode preflight is a shell block inside the command's
      # markdown, so it has no compiler and no import to break loudly. This
      # extracts and runs the shipped block against fixture host repos.
      - name: Test /design board mode (esas-design)
        run: |
          sh scripts/test-esas-design.sh
          PREFLIGHT_SH=dash sh scripts/test-esas-design.sh
          PREFLIGHT_SH=bash sh scripts/test-esas-design.sh
      # /build runs ready slices concurrently in a reusable worktree pool, and
      # the git half of that (size, provision, unconditional reset, cherry-pick
      # land, guarded teardown) is `bin/worktree-pool`. A new script under
      # plugins/ is collected by no step above — the hook suites hardcode their
      # scripts — so without this step it would ship with the workflow green.
      # The suite drives it over throwaway git repos with stub install/build
      # commands. POOL_SH varies the launcher's interpreter with the suite's.
      - name: Test the worktree pool (throwaway git repos)
        run: |
          sh scripts/test-worktree-pool.sh
          POOL_SH=dash dash scripts/test-worktree-pool.sh
          POOL_SH=bash bash scripts/test-worktree-pool.sh
      # Every command that reads or writes a work item's committed design reaches
      # its folder through `bin/work-docs-path` (root from the repo's
      # `.claude/bett3r-ai-workflow.json` `workDocsRoot`, else `docs/prs`; the id
      # normalised). A new script under plugins/ is collected by no step above,
      # and its load-bearing half is a refusal — an unusable config must be a
      # loud error, never a silent default — whose failure is invisible in any
      # session that happens to have a clean config. WDP_SH varies the launcher's
      # interpreter with the suite's.
      - name: Test the work-docs path rule (throwaway git repos)
        run: |
          sh scripts/test-work-docs-path.sh
          WDP_SH=dash dash scripts/test-work-docs-path.sh
          WDP_SH=bash bash scripts/test-work-docs-path.sh
      # `/design` renders its map through `bin/design-map render`, and the page
      # tells the owner an unanswered fork is taken on its recommendation — so a
      # fork dropped before the page is agreed to unseen (concern C1), and a bare
      # `actor` key would let a map role join an op's ActorId (C2). Both are
      # refusals whose failure is a green-looking page. A new script under
      # plugins/ is collected by no step above. DM_SH varies the launcher's
      # interpreter with the suite's.
      - name: Test the design-map render (fork counts + schema)
        run: |
          sh scripts/test-design-map.sh
          DM_SH=dash dash scripts/test-design-map.sh
          DM_SH=bash bash scripts/test-design-map.sh
      # The design-multi subject grouping (ESAS-166 D2/D4/Fork 1): units group by
      # epic link, accepted seam proposals override, and the fingerprint plus
      # `asked` tell a resume which subjects to re-ask.
      - name: Test the design-multi subject grouping (epic link + fingerprint)
        run: |
          sh scripts/test-design-multi-subjects.sh
          DMS_SH=dash dash scripts/test-design-multi-subjects.sh
          DMS_SH=bash bash scripts/test-design-multi-subjects.sh
      # The design map snapshot verdicts (ESAS-162): `design-map count` is the
      # goal-signal line /verify-build puts in the PR body, and `design-map drift`
      # says whether the committed map.json lags the map feed. Both are script
      # verdicts an agent quotes, so a wrong count or exit code would be carried
      # into the PR as fact. DS_SH varies the launcher's interpreter.
      - name: Test the design map snapshot verdicts (count + drift)
        run: |
          sh scripts/test-design-snapshot.sh
          DS_SH=dash dash scripts/test-design-snapshot.sh
          DS_SH=bash bash scripts/test-design-snapshot.sh
      # Decision text is a generated region of map.json (ESAS-163, ADR-007):
      # `map-tree check` is what refuses a stale or hand-edited region before a
      # tracker write, and `write --on-tamper displace` rewrites design.md in an
      # unattended run. A wrong hash or splice passes silently. MT_SH varies the
      # launcher's interpreter.
      - name: Test the map-tree generated region (render + write + check)
        run: |
          sh scripts/test-map-tree.sh
          MT_SH=dash dash scripts/test-map-tree.sh
          MT_SH=bash bash scripts/test-map-tree.sh
      # The candidate-oracle shape of slices.yaml (ESAS-165): which map walks
      # /plan may offer, check-plan's refusals of an unattended plan, and that
      # the trailing review:/candidateOracles: block leaves the pool width alone.
      # PC_SH varies the launchers' interpreter.
      - name: Test the plan candidate oracles (candidates + check-plan + pool width)
        run: |
          sh scripts/test-plan-candidates.sh
          PC_SH=dash dash scripts/test-plan-candidates.sh
          PC_SH=bash bash scripts/test-plan-candidates.sh
      # /merge-multi rules each unit's own concerns from its head commit before
      # merging it — the hard block design F4/C2 puts here, never trusting the
      # advisory `flow/concerns` GitHub status. A presence-only check on that
      # prose would pass an inverted meaning (reading the working tree, or a
      # missing --decisions) silently, so this drives merge-multi.md's own
      # fenced command block for real, against throwaway unit branches.
      - name: Test /merge-multi rules each unit's concerns before merging (throwaway git repo)
        run: |
          sh scripts/test-merge-multi-concerns.sh
          dash scripts/test-merge-multi-concerns.sh
          bash scripts/test-merge-multi-concerns.sh
      # /verify-build copies build-summary.md's usage numbers from
      # `run-metrics --usage-fragment` before it opens the PR. No step above
      # executes run-metrics, and its slice attribution is a regex over a
      # dispatch's description whose failure is a quietly wrong number, not an
      # error. The suite drives the real script over a transcript fixture under
      # a temp HOME and recomputes token sums, attribution and proration from the
      # fixture rows (mirroring only the branch filter and the gap rule).
      # The script is run by node directly, so only the suite's shell varies.
      # Its judge needs PyYAML: installed here when missing, and the suite fails
      # loudly (never skips) if it still cannot import it.
      - name: Test the run-metrics usage fragment (transcript fixture)
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          sh scripts/test-run-metrics.sh
          dash scripts/test-run-metrics.sh

      # `bin/check-skill-shadows` runs in HOST repos, not here — it compares a
      # repo's `.claude/` against the plugins actually installed on that machine,
      # which this runner has none of. So what CI can gate is the detector
      # itself, and that is the half that needs gating: it guards a failure whose
      # only signature is absence (a local skill and a plugin skill of the same
      # name both load, neither errors, and the staler local one wins), so it is
      # the sole thing that would ever report one — and a detector that has
      # quietly stopped detecting is indistinguishable from a clean fleet of
      # repos. The suite drives it over throwaway host repos and plugin trees,
      # and includes the mutation: edited into never matching, it must exit 2
      # with SELF-CHECK FAILED rather than report a clean repo.
      - name: Test the shadow detector (throwaway host repos)
        run: |
          sh scripts/test-skill-shadows.sh
          SHADOW_PY=python3 sh scripts/test-skill-shadows.sh
      # `.claude/gate.sh` is the local copy of this workflow (CI is not always
      # available to run it), and a copy fails by absence: a step added here and
      # not there leaves the local gate green over a check it never ran. This
      # asserts every `run:` line above and below appears verbatim in the gate.
      - name: Test the host gate covers every workflow step (drift)
        run: sh scripts/test-gate-drift.sh

  # These two are a SEPARATE JOB on purpose, not tidiness. Steps inside a job
  # run sequentially and fail-fast, so the first red step ends the job and every
  # step after it reports `skipped` — which, on a run already headlined `fail`,
  # is indistinguishable from passing without opening the step list. That bill
  # has been paid: `test-esas-design.sh` sat red on master for five pushes and
  # silently removed the version gate below — the ADR-001 release contract, the
  # most load-bearing check on a plugin PR — from two real PRs, whose lanes each
  # correctly reported "the only failure is the known baseline". Which gates a
  # red step eats depends only on their order in this file, never on what the
  # diff touched. A reviewer who has to remember to open the step list is not a
  # control; a sibling job is.
  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate below diffs this branch against its merge base, and
          # the default depth-1 checkout has no base ref to resolve — the gate
          # would error instead of judging. This is the one failure invisible on
          # a laptop, where every ref is already on disk.
          fetch-depth: 0
      # Every step above reads the source tree. This one reads the *diff*,
      # because the failure it guards is not in any file: a plugin is copied into
      # the version-keyed cache only when its `version` string changes, so a
      # correct source tree that kept its old version reaches nobody — which is
      # how two behaviour-changing commits once shipped with this workflow green,
      # and green correctly.
      #
      # The gate and its oracle live in scripts/, outside plugins/**, and that is
      # load-bearing rather than tidy: a rule that lived inside a plugin would
      # count as a touch of that plugin, so changing the rule — or repairing
      # it — would demand a release. Outside, it never fires on its own change,
      # and it exempts nothing else.
      #
      # On `push` to master the base is master, the diff is empty, and this is a
      # correct no-op; the judgement happens on the pull request.
      - name: Require a version bump for every touched plugin
        run: sh scripts/check-plugin-version-bump.sh "origin/${{ github.base_ref || 'master' }}"
      # The gate itself has no compiler and only ever runs on somebody else's PR,
      # so a broken one is discovered by the PR it wrongly judged. This drives it
      # over throwaway git repos. Both interpreters are varied together — the
      # suite's and the gate's — because `sh` is dash on Debian/Ubuntu and bash
      # on macOS, and both scripts ship as POSIX.
      - name: Test the version gate (throwaway git repos)
        run: |
          sh scripts/test-version-gate.sh
          GATE_SH=dash dash scripts/test-version-gate.sh
          GATE_SH=bash bash scripts/test-version-gate.sh
