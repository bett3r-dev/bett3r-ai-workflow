# TAUTOLOGY: a `then:` whose expected value came from nowhere anybody can name
# is one recomputed the way the code will compute it — red before the code, green
# after, and unable to disagree with it ever.
seams:
  - name: the launcher's verdict line
    at: plugins/bett3r-ai-workflow/bin/design-map:1
    kind: existing
ticket: ESAS-9
review: unattended
slices:
  - id: 1
    probe: delete the expected_from check; the oracle must go red
    seam: the launcher's verdict line
    name: "slice one"
    oracle: |
      the launcher prints outcome=ok and exits 0
    scenarios:
      - scenario: a scenario names no source for its expected value
        given: a behavioural scenario
        when: it carries no expected_from
        then: the launcher refuses it
